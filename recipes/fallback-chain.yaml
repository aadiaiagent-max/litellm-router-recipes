# One public alias, a second deployment if the first errors out.
# https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 20
  - model_name: chat-backup
    litellm_params:
      model: anthropic/claude-3-5-haiku-latest
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 20

router_settings:
  num_retries: 1
  timeout: 30
  fallbacks:
    - chat:
        - chat-backup
